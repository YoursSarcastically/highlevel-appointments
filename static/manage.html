<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your booking</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e6e8ec;--ink:#0f1115;--ink2:#4b5563;--ink3:#8a929e;--accent:#2f5bea;--red:#c62828;--red-soft:#fdecec;--green:#15803d;--green-soft:#e8f6ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 48px}.hero{background:var(--ink);color:#fff;padding:26px 20px 20px;border-radius:0 0 18px 18px;margin:0 -16px 18px}.hero h1{margin:0;font-size:22px;font-weight:700}.hero .sub{opacity:.75;font-size:13.5px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}.card h2{margin:0 0 4px;font-size:16px}.muted{color:var(--ink2);font-size:13.5px}.faint{color:var(--ink3);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:600 14px Inter,sans-serif;cursor:pointer;color:var(--ink)}.btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:600 13px Inter,sans-serif;cursor:pointer;color:var(--ink)}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.notice{padding:10px 12px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:13px}.ok{background:var(--green-soft);color:var(--green)}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:16px 0 8px}footer{text-align:center;color:var(--ink3);font-size:12px;margin-top:24px}
</style></head><body><div class="wrap" id="app"><div class="hero"><h1>Loading…</h1></div></div>
<script>
const parts=location.pathname.split('/').filter(Boolean);const slug=parts[1]||'',token=parts[2]||'';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');const fmtT=t=>{const [h,m]=t.split(':').map(Number);return ((h+11)%12+1)+(m?':'+pad(m):'')+(h>=12?' PM':' AM')};const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};const fmtD=s=>{const d=new Date(s+'T12:00');return DAYS[(d.getDay()+6)%7]+' '+d.getDate()+' '+MON[d.getMonth()]};
let A=null,mode='view',mv={date:null,time:null},slots=[],busy=false,done=null,err='';
async function api(m,p,b){const r=await fetch(p,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function loadSlots(){busy=true;render();try{const q=new URLSearchParams({service_id:A.service_id,staff_id:A.staff_id,date:mv.date});slots=(await api('GET','/api/public/'+slug+'/availability?'+q)).slots.filter(t=>!(mv.date===A.date&&t===A.time))}catch(e){slots=[]}busy=false;render()}
function render(){const a=$('#app');if(!A){a.innerHTML='<div class="hero"><h1>'+esc(err||'Loading…')+'</h1></div>';return}const head='<div class="hero"><h1>'+esc(A.business)+'</h1><div class="sub">Your booking</div></div>';
 if(done){a.innerHTML=head+'<div class="card"><h2>'+(done.kind==='cancel'?'Cancelled':'Moved')+'</h2><div class="muted">'+(done.kind==='cancel'?'Your appointment has been cancelled.'+(done.fee?' A late-cancellation fee of $'+done.fee.toFixed(2)+' was charged to your card.':''):'See you on '+fmtD(done.date)+' at '+fmtT(done.time)+'.')+'</div></div><footer>Powered by HighLevel</footer>';return}
 const past=A.status!=='booked';const info='<div class="card"><h2>'+esc(A.service)+'</h2><div class="muted">'+fmtD(A.date)+' at '+fmtT(A.time)+' · '+A.dur+' min · with '+esc(A.staff.split(' ')[0])+'</div><div class="faint" style="margin-top:6px">'+(A.deposit?'Deposit paid $'+A.deposit.toFixed(2)+' · ':'')+'Free to cancel until '+A.cancel_hours+' hours before'+(A.late_fee?'; after that a $'+A.late_fee.toFixed(2)+' fee applies':'')+'.</div>'+(past?'<div class="notice" style="margin-top:10px">This booking is '+esc(A.status)+' and cannot be changed online.</div>':!A.self_service?'<div class="notice" style="margin-top:10px">Please call to change this booking.</div>':(A.late?'<div class="notice" style="margin-top:10px">This is inside the '+A.cancel_hours+'-hour window.'+(A.late_fee?' Cancelling now charges the $'+A.late_fee.toFixed(2)+' fee.':'')+'</div>':''))+'</div>';
 let body='';if(!past&&A.self_service){if(mode==='view')body='<div class="row"><button class="btn p" id="mvbtn">Move it</button><button class="btn danger" id="cancelbtn">Cancel booking</button></div>';
  if(mode==='move')body='<div class="card"><h2>Pick a new time</h2><h3>Day</h3><div class="row">'+Array.from({length:10},(_,i)=>{const x=iso(addD(new Date(),i));return '<button class="chip '+(x===mv.date?'on':'')+'" data-date="'+x+'">'+(i===0?'Today':DAYS[(new Date(x+'T12:00').getDay()+6)%7]+' '+ +x.slice(8))+'</button>'}).join('')+'</div>'+(mv.date?'<h3>Time</h3>'+(busy?'<div class="faint">Checking…</div>':slots.length?'<div class="row">'+slots.map(t=>'<button class="chip '+(mv.time===t?'on':'')+'" data-time="'+t+'">'+fmtT(t)+'</button>').join('')+'</div>':'<div class="faint">No openings that day</div>'):'')+'<div class="row" style="margin-top:14px"><button class="btn p" id="confirmmv" '+(mv.time?'':'disabled')+'>Confirm'+(mv.time?' '+fmtT(mv.time):'')+'</button><button class="btn" id="back">Back</button></div>'+(err?'<div class="notice" style="margin-top:8px">'+esc(err)+'</div>':'')+'</div>';
  if(mode==='cancel')body='<div class="card"><h2>Cancel this booking?</h2><div class="muted">'+(A.late&&A.late_fee?'A $'+A.late_fee.toFixed(2)+' late-cancellation fee will be charged to your card on file.':'You can book again any time.')+'</div><div class="row" style="margin-top:14px"><button class="btn danger" id="confirmcancel">Yes, cancel</button><button class="btn" id="back">Keep it</button></div>'+(err?'<div class="notice" style="margin-top:8px">'+esc(err)+'</div>':'')+'</div>'}
 a.innerHTML=head+info+body+'<footer>Powered by HighLevel</footer>'}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;err='';if(b.id==='mvbtn'){mode='move';mv={date:null,time:null};render()}else if(b.id==='cancelbtn'){mode='cancel';render()}else if(b.id==='back'){mode='view';render()}else if(b.dataset.date){mv.date=b.dataset.date;mv.time=null;await loadSlots()}else if(b.dataset.time){mv.time=b.dataset.time;render()}else if(b.id==='confirmmv'){try{const r=await api('POST','/api/public/'+slug+'/manage/'+token+'/move',{date:mv.date,time:mv.time});done={kind:'move',date:r.date,time:r.time}}catch(x){err=x.message}render()}else if(b.id==='confirmcancel'){try{const r=await api('POST','/api/public/'+slug+'/manage/'+token+'/cancel',{});done={kind:'cancel',fee:r.fee}}catch(x){err=x.message}render()}});
(async()=>{try{A=await api('GET','/api/public/'+slug+'/manage/'+token);document.title='Your booking · '+A.business}catch(e){err=e.message||'This link is no longer valid'}render()})();
</script></body></html>
