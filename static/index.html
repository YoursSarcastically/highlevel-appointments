<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Appointments</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f1f4f9;--card:#fff;--card2:#f6f8fb;--line:#e3e8ef;--ink:#0f172a;--ink2:#475569;--ink3:#8a94a6;--blue:#2563eb;--blue-soft:#e8efff;--nav:#0f172a;--nav2:#1e293b;--nav-ink:#e2e8f0;--nav-mute:#8b96a8;--red:#dc2626;--red-soft:#fdecec;--green:#16a34a;--green-soft:#e6f6ec;--amber:#b45309;--amber-soft:#fdf3e1;--violet:#6d28d9;--violet-soft:#efe9fe;--r:12px;--f:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%}
html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}input,select{font:inherit;color:var(--ink)}
h1,h2,h3{margin:0;letter-spacing:-.01em}h1{font-size:22px;font-weight:700}h2{font-size:15px;font-weight:700}h3{font-size:13px;font-weight:700}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:12.5px}.xs{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--card2)}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.p:hover{filter:brightness(.95)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}.btn.xs{padding:3px 8px;font-size:11.5px;border-radius:7px}.btn.link{border:0;background:none;color:var(--blue);padding:6px 8px}.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--card2);color:var(--ink2);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}.tag.green{background:var(--green-soft);color:var(--green)}.tag.blue{background:var(--blue-soft);color:var(--blue)}.tag.amber{background:var(--amber-soft);color:var(--amber)}.tag.violet{background:var(--violet-soft);color:var(--violet)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink2)}.seg button.on{background:var(--card2);color:var(--ink)}
.sw{position:relative;width:38px;height:22px;border-radius:999px;background:var(--line);border:0;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--blue)}.sw.on::after{left:19px}
.badge{background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:auto}
/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{background:var(--nav);color:var(--nav-ink);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;font-size:16px}.brand i{width:26px;height:26px;border-radius:7px;background:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:800;font-style:normal;color:#fff}
.acct{background:var(--nav2);border-radius:10px;padding:10px 12px;margin-bottom:10px}.acct b{display:block;font-size:13.5px}.acct span{font-size:12px;color:var(--nav-mute)}
.srch{background:var(--nav2);border-radius:9px;padding:8px 12px;color:var(--nav-mute);font-size:13px;display:flex;justify-content:space-between;margin-bottom:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--nav-mute);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a.native{opacity:.55;cursor:default}.nav a.live{color:var(--nav-ink);font-weight:600}.nav a.live:hover{background:rgba(255,255,255,.06)}.nav a.on{background:var(--blue);color:#fff}
.nav .sec{font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--nav-mute);padding:16px 10px 6px}
.nav a .ic{width:18px;text-align:center;font-size:13px}
.side .note{margin-top:auto;font-size:11.5px;color:var(--nav-mute);padding:10px 8px 0}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.crumb{color:var(--ink3);font-size:14px}.crumb b{color:var(--ink);font-weight:600}
.content{padding:20px 24px 40px;display:flex;flex-direction:column;gap:16px}
.page{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;min-height:70vh;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.phead p{margin:2px 0 0;color:var(--ink2)}
/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.board{grid-template-columns:1fr}}
.col{background:var(--card2);border-radius:12px;padding:12px;min-height:300px}
.col h4{margin:0 0 10px;font-size:11.5px;letter-spacing:.1em;font-weight:700;color:var(--ink3);display:flex;gap:8px}
.col.hot{background:#fff5f2}
.ap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.ap.due{border-color:#f5b8a8}.ap .who{font-weight:700;font-size:14px}.ap .svc{margin:6px 0 8px;font-size:13px}
.ap .svc b{font-weight:600}.ap .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ap .price{font-weight:700;margin-right:auto}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
/* schedule */
.sched{display:grid;grid-template-columns:56px repeat(var(--cols),minmax(140px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sched .hd{padding:10px;border-bottom:1px solid var(--line);background:var(--card2);font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.sched .tcol{border-right:1px solid var(--line);background:var(--card2)}
.sched .t{height:48px;font-size:11px;color:var(--ink3);padding:4px 6px;border-bottom:1px solid var(--line)}
.sched .lane{position:relative;border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 47px,var(--line) 47px 48px)}
.sched .lane.off{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px)}
.blk{position:absolute;left:4px;right:4px;border-radius:8px;padding:6px 8px;font-size:12px;border:1px solid var(--line);background:var(--blue-soft);color:var(--ink);cursor:pointer;overflow:hidden}
.blk b{display:block;font-size:12px}.blk.cls{background:var(--violet-soft)}.blk.done{opacity:.55}.blk.noshow{background:var(--red-soft)}.blk.arrived{background:var(--green-soft)}
.blk .g{font-size:11px;color:var(--ink2)}
.days{display:flex;gap:6px;flex-wrap:wrap}.day{padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-weight:600;font-size:12.5px}.day.on{background:#0f172a;color:#fff;border-color:#0f172a}
/* catalog */
.cat{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cat .ch{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--line)}
.cat .ch b{font-size:14px}.cat .ch .n{color:var(--ink3);font-size:13px}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}.item .em{width:44px;height:44px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:20px}
.item b{font-size:14px;display:block}.item .d{color:var(--ink2);font-size:13px}.item .pr{font-weight:700;font-size:14px;min-width:70px;text-align:right}
.item .tg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
/* passes */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media (max-width:900px){.pgrid{grid-template-columns:1fr}}
.pass{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}.pass .pp{font-size:22px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}.r{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}@media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px}.kpi .l{font-size:12px;font-weight:600;color:var(--ink2)}.kpi .v{font-size:24px;font-weight:800;margin:4px 0 2px}.kpi .s{font-size:12px;color:var(--ink3)}
/* booking page preview */
.phone{width:340px;max-width:100%;border:1px solid var(--line);border-radius:22px;background:var(--card);overflow:hidden}
.phone .ph{padding:18px 16px 12px;background:#0f172a;color:#fff}.phone .pb{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:380px;background:var(--card2)}
.slot{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-weight:600;font-size:12.5px}.slot.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);display:flex;justify-content:space-between;cursor:pointer;font-size:13px}.opt.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
/* overlay + drawer */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .md{background:var(--card);border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ov.right{justify-content:flex-end;padding:0}.ov.right .md{height:100%;max-height:100%;border-radius:0;width:min(440px,100%)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.x{border:0;background:var(--card2);width:28px;height:28px;border-radius:50%}
.onb{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding:40px 16px}
.onb .in{max-width:680px;margin:0 auto;text-align:center}.onb .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:left;margin-top:22px;display:flex;flex-direction:column;gap:12px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--blue)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.type{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;font-weight:600}.type.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.type span{display:block;font-size:26px;margin-bottom:6px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:100;pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.mvp li{margin:6px 0;display:flex;gap:8px;align-items:flex-start}.mvp li i{font-style:normal;font-weight:800}.mvp .ok i{color:var(--green)}.mvp .no i{color:var(--red)}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.content{padding:14px}.page{padding:14px}.kpis{grid-template-columns:1fr 1fr}}
.tabs{display:flex;gap:2px;margin:-22px -22px 0;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--card2);border-radius:14px 14px 0 0}.tabs a{display:flex;align-items:center;gap:7px;padding:12px 14px;font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}.tabs a:hover{color:var(--ink)}.tabs a.on{color:var(--blue);border-color:var(--blue)}.tabs a:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;border-radius:6px}.tabs .ic{font-size:13px}.tabs .badge{margin-left:2px}@media (max-width:860px){.tabs{margin:-14px -14px 0}}
</style>
<style>
/* ---- quiet theme: flat surfaces, one accent, no motion ---- */
:root{--bg:#f3f5f8;--card:#fff;--card2:#f6f7f9;--line:#e5e8ee;--ink:#111827;--ink2:#4b5563;--ink3:#8b94a3;--blue:#3056d3;--blue-soft:#eaeefb;--nav:#111827;--nav2:#1f2937;--nav-ink:#e5e7eb;--nav-mute:#9ca3af;--r:10px}
body{background:var(--bg)}
.side{background:var(--nav);border-right:0}
.brand i{background:var(--blue);box-shadow:none}
.acct,.srch{background:var(--nav2);border:0}
.nav a{border-radius:8px}.nav a.on{background:var(--blue);box-shadow:none}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.page{border:1px solid var(--line);box-shadow:none;border-radius:12px}
.card,.ap,.pass,.kpi,.cat,.sched{box-shadow:none;border-radius:10px}
.ap:hover{box-shadow:none;transform:none;background:var(--card2)}
.btn{border-radius:8px;box-shadow:none}.btn:active{transform:none}.btn.p{background:var(--blue);border-color:var(--blue)}.btn.p:hover{background:#2747b8}
.input{border-radius:8px}.input:focus{outline:0;border-color:var(--blue);box-shadow:none}
.seg{border-radius:9px;background:var(--card2);border-color:transparent}.seg button.on{background:var(--card);box-shadow:none;border:1px solid var(--line)}
.tag{border-radius:6px}.badge{box-shadow:none}
.sw{background:#d1d5db}.sw.on{background:var(--blue)}
.tabs{background:transparent;border-bottom:1px solid var(--line);gap:0;padding:0 6px}
.tabs a{border-radius:0;padding:12px 14px;border-bottom:2px solid transparent;color:var(--ink2)}.tabs a:hover{background:transparent;color:var(--ink)}.tabs a.on{background:transparent;color:var(--ink);border-color:var(--ink)}
.tabs .ic{display:none}
h1{font-size:22px;letter-spacing:-.01em}
.col{border-radius:10px}.blk{border-radius:8px;box-shadow:none}
.day.on{background:var(--ink);box-shadow:none}
.ov{background:rgba(17,24,39,.45);backdrop-filter:none;-webkit-backdrop-filter:none}.ov .md{border-radius:12px;box-shadow:0 10px 30px rgba(17,24,39,.2)}
.toast{border-radius:8px;background:var(--ink);box-shadow:none}
.onb .box{border-radius:12px;box-shadow:none}.type{border-radius:10px}.type:hover{box-shadow:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid2 .card{margin:0}.grid2.cards{align-items:start}
.scrollx{overflow-x:auto}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
*{transition:none!important}
/* ---- schedule ---- */
.schedwrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.sched{border:0;border-radius:0;min-width:100%}
.sched .hd{position:sticky;top:0;z-index:4;background:var(--card);padding:10px 12px;border-bottom:1px solid var(--line)}
.sched .hd.tcol{z-index:5;left:0}
.sched .tcol{position:sticky;left:0;z-index:3;background:var(--card2)}
.sched .t{font-variant-numeric:tabular-nums;color:var(--ink3)}.sched .t.hr{border-top:1px solid var(--line);color:var(--ink2)}
.sched .lane:hover{background-color:transparent}
.lane .offband{position:absolute;left:0;right:0;background:var(--card2);pointer-events:none}
.nowline{position:absolute;left:0;right:0;height:1px;background:var(--red);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:0;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.blk{border:1px solid var(--line);border-left:3px solid var(--c,var(--blue));padding:6px 8px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.blk:hover{box-shadow:none;transform:none;border-color:var(--ink3)}
.blk .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.blk b{font-size:12.5px}.blk .g{font-size:11px;color:var(--ink2)}
.blk .st{font-size:11px;color:var(--ink3);flex:none}
.blk.late{border-color:var(--red);border-left-color:var(--red);background:var(--red-soft)}.blk.late .st,.blk.noshow .st{color:var(--red)}
.blk.arrived{background:var(--green-soft)}.blk.arrived .st{color:var(--green)}.blk.done{opacity:.55;background:var(--card2)}
.blk.short{padding:4px 8px}
.blk.cls{border-left-color:var(--violet);background:var(--violet-soft)}.blk .bar{height:3px;background:rgba(109,40,217,.15);border-radius:2px;margin-top:auto;overflow:hidden}.blk .bar i{display:block;height:100%;background:var(--violet)}
.days{gap:6px}.days .day{display:flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:8px}
.days .day .dn{font-size:12px}.days .day .dd{font-size:12px;font-weight:600;opacity:.8}.days .day .dc{font-size:11px;color:var(--ink3);font-weight:500}.days .day.on .dc{color:rgba(255,255,255,.75)}
.card.final{border:1px solid var(--line);background:var(--card)}
.kpi .v .s{font-size:13px;font-weight:600;color:var(--ink3)}
/* ---- much simpler ---- */
.srch{display:none}
.nav .ic{display:none}.nav a{padding:7px 10px;font-size:13px}.nav a.native{opacity:.45}
.acct{background:transparent;border:0;padding:6px 10px 12px}.acct span{display:none}
.brand{padding-bottom:6px}
.top{padding:10px 24px}.crumb{font-size:13px}
.seg{background:transparent;border:1px solid var(--line);padding:2px}.seg button{padding:5px 10px;font-size:12.5px}
.content{padding:16px 24px 32px}.page{border:0;background:transparent;padding:0}
.phead{padding-bottom:8px;border-bottom:1px solid var(--line)}
h1{font-size:20px}.phead p{font-size:13px;margin-top:0}
.tabs{margin:0 0 8px;padding:0;border-bottom:1px solid var(--line)}.tabs a{padding:10px 0;margin-right:22px;font-size:13px}
.ap{border:0;border-radius:0;border-bottom:1px solid var(--line);padding:12px 2px;margin:0;background:transparent}
.ap:hover{background:transparent}
.ap .tag{background:transparent;padding:0;width:60px!important;justify-content:flex-start!important;color:var(--ink3);font-weight:500}
.ap .tag.green{color:var(--green)}.ap .tag.red{color:var(--red)}.ap .tag.violet{color:var(--violet)}
.ap.due{border-color:var(--line)}
.btn{border-radius:6px;font-weight:500}.btn.sm{padding:5px 10px}
.card{border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 0}
.grid2.cards .card{border:1px solid var(--line);border-radius:8px;padding:14px}
.kpi{border-radius:8px}.badge{font-size:10px;padding:0 6px}
.sw{width:32px;height:18px}.sw::after{width:12px;height:12px;top:3px;left:3px}.sw.on::after{left:17px}
.days .day{border:0;background:transparent;padding:6px 8px;color:var(--ink2)}.days .day.on{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:6px}.days .day.on .dc{color:var(--ink3)}
.schedwrap{border:0;border-radius:0;border-top:1px solid var(--line)}
.sched .hd{padding:8px 10px;font-weight:500}.sched .hd .av{display:none}.sched .hd .xs{display:none}
.sched .tcol{background:transparent}.sched .lane{border-right:1px solid var(--line)}
.lane .offband{display:none}.sched .lane.off{background:var(--card2)}
.blk{border:1px solid var(--line);border-left:1px solid var(--line);background:var(--card);color:var(--ink)}
.blk.arrived{background:var(--green-soft);border-color:transparent}.blk.late{background:var(--red-soft);border-color:transparent}.blk.cls{background:var(--violet-soft);border-color:transparent}
.blk .st{display:none}.blk.late .st,.blk.done .st{display:inline}
.blk .bar{display:none}

const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

/* ---------- schedule ---------- */
function pgSched(){const d=UI.sched;const w=dow(parse(d));const isToday=d===TODAY;const hours=S.staff.map(s=>s.hours[w]).filter(Boolean);const classes=(S.features.classes?S.classes:[]).filter(c=>c.days.includes(w));const dayAppts=S.appts.filter(a=>a.date===d&&a.status!=='cancelled');
 let start=hours.length?Math.min(...hours.map(h=>mins(h[0]))):mins(S.rules.open),end=hours.length?Math.max(...hours.map(h=>mins(h[1]))):mins(S.rules.close);

 const rows=[];for(let m=start;m<end;m+=30)rows.push(m);const H=48;const px=m=>(m-start)/30*H;

  return '<div class="lane '+(h?'':'off')+'" style="height:'+(rows.length*H)+'px" data-a="lane" data-sid="'+st.id+'" data-date="'+d+'" data-start="'+start+'">'+(h?off:'<div class="xs faint" style="padding:8px">Day off</div>')+items+nowline+'</div>'};
 const head=st=>{const h=st.hours[w];const mine=dayAppts.filter(a=>a.staffId===st.id);const booked=sum(mine,a=>SV(a.serviceId).dur);return '<div class="hd"><span class="av" style="background:'+st.color+'">'+initials(st.name)+'</span><div class="grow" style="min-width:0"><b class="nm" style="display:block">'+esc(st.name)+(st.clockIn&&isToday?' <span style="color:var(--green)" title="Clocked in">●</span>':'')+'</b><span class="xs faint">'+(h?fmtT(h[0])+'–'+fmtT(h[1])+' · '+mine.length+' appt'+(mine.length===1?'':'s')+(booked?' · '+(booked/60).toFixed(1)+'h':''):'off today')+'</span></div></div>'};
 const days=Array.from({length:7},(_,i)=>{const x=iso(addD(now(),i));const n=S.appts.filter(a=>a.date===x&&a.status!=='cancelled').length;const dd=parse(x);return '<button class="day '+(x===d?'on':'')+'" data-a="sday" data-d="'+x+'" aria-label="'+DAYS[dow(dd)]+' '+dd.getDate()+', '+n+' appointments"><span class="dn">'+(i===0?'Today':DAYS[dow(dd)]+' '+dd.getDate())+'</span>'+(n?'<span class="dc">'+n+'</span>':'')+'</button>'}).join('');

 }

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.classList.contains('sw')||el.classList.contains('btn'))e.stopPropagation();if(el.dataset.a==='ovclose'&&e.target!==el)return;if(el.tagName==='A')e.preventDefault();A[el.dataset.a]&&A[el.dataset.a](el,e)});
